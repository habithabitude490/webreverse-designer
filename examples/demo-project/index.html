<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo Bakery — fictional case</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">Demo Bakery</div>
    <nav class="main-nav" id="nav">
      <a href="#">Home</a><a href="#">Our breads</a><a href="#">Contact</a>
    </nav>
    <a class="btn btn-primary" href="#order">Order</a>
  </header>
  <main>
    <section class="hero" id="hero">
      <h1>Fresh bread every morning</h1>
      <p>Artisan, organic, baked on site.</p>
      <a class="btn btn-primary" href="#order">Order</a>
    </section>
    <section class="cards">
      <article class="card"><h2>Baguette</h2><p>Crusty.</p></article>
      <article class="card"><h2>Sourdough</h2><p>Natural starter.</p></article>
      <article class="card"><h2>Croissant</h2><p>Fine butter.</p></article>
    </section>
    <form class="contact" id="order">
      <label for="name">Name</label>
      <input id="name" name="name" type="text">
      <button class="btn btn-primary" type="submit">Send</button>
    </form>
  </main>
  <footer class="site-footer"><p>Demo Bakery — fictional example.</p></footer>
  <script src="app.js"></script>
</body>
</html>
